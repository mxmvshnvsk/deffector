# Releases the browser extension when an extension tag is pushed (extension-v0.1.2 …, the version
# from packages/extension/static/manifest.json):
#   - a GitHub release with deffector-chrome-<version>.zip (Chrome and Edge: the file uploaded to the
#     Chrome Web Store; without the store, unzip it and Load unpacked in developer mode);
#   - the Firefox build submitted to the addons.mozilla.org catalogue (listed);
#   - the Chrome build submitted to the Chrome Web Store.
# Both stores review the version and publish it themselves once approved.
# The AMO upload needs the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets (addons.mozilla.org →
# Developer Hub → API keys). AMO accepts each version once: bump the manifest version for every
# extension release. A version already on AMO (uploaded by hand) is skipped.
# The Chrome Web Store upload needs CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN (a Google OAuth
# client with the Chrome Web Store API) and CWS_PUBLISHER_ID (the developer dashboard → Account);
# without them the step is skipped.
name: extension release

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing extension tag to build again, e.g. extension-v0.1.1
        required: true

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the extension version
        run: |
          VERSION=$(node -p "require('./packages/extension/static/manifest.json').version")
          if [ "$TAG" != "extension-v$VERSION" ]; then
            echo "The manifest version is $VERSION, the tag is $TAG" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # a store review takes days, so a broken build must not get that far:
      # the same checks release.yml runs before publishing to npm
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Build for Chrome, Edge and Firefox
        run: |
          npm run build -w @deffector/extension
          npm run build:firefox -w @deffector/extension

      - name: Package for Chrome and Edge
        run: |
          mkdir -p release
          (cd packages/extension/dist && zip -qr "$GITHUB_WORKSPACE/release/deffector-chrome-$VERSION.zip" .)

      # The build is bundled and minified, so AMO asks for the source and how to build it
      - name: Prepare the source code for AMO
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/source.zip" HEAD
          cat > "$RUNNER_TEMP/AMO-BUILD.md" <<'EOF'
          # Building the Firefox extension

          Requirements: Linux or macOS, Node.js 22, npm 10 or newer.

          ```sh
          npm ci
          npm run build -w @deffector/extension
          npm run build:firefox -w @deffector/extension
          ```

          The Firefox extension is written to `packages/extension/dist-firefox`. Its sources are in
          `packages/extension/src`, `packages/panel/src` and `packages/protocol/src`; esbuild bundles
          and minifies them (`packages/extension/build.mjs`).
          EOF
          (cd "$RUNNER_TEMP" && zip -q source.zip AMO-BUILD.md)

      # Submits the version for review without waiting for it: reviews can take days
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set +e
          npx --yes web-ext@10 sign \
            --source-dir packages/extension/dist-firefox \
            --artifacts-dir "$RUNNER_TEMP/signed" \
            --channel listed \
            --upload-source-code "$RUNNER_TEMP/source.zip" \
            --approval-timeout 0 2>&1 | tee "$RUNNER_TEMP/amo.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qiE 'already exists|uploaded before' "$RUNNER_TEMP/amo.log"; then
              echo "::notice::addons.mozilla.org already has $VERSION, nothing to upload"
            else
              exit "$status"
            fi
          fi

      - name: Submit to the Chrome Web Store
        env:
          EXTENSION_ID: cnnimkkficcbbkaohlafpnbgpkhpkfjn
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ]; then
            echo "::notice::No Chrome Web Store secrets, the upload is skipped"
            exit 0
          fi
          # uploads the zip and submits it for review; the store publishes it once approved
          npx --yes chrome-webstore-upload-cli@4 --source "release/deffector-chrome-$VERSION.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Chrome and Edge:** install from the [Chrome Web Store](https://chromewebstore.google.com/detail/cnnimkkficcbbkaohlafpnbgpkhpkfjn), or download \`deffector-chrome-$VERSION.zip\`, unzip it and load the folder with **Load unpacked** in \`chrome://extensions\` (developer mode).

          **Firefox 140+:** install from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/deffector/). A new version appears there after Mozilla reviews it.

          The agent is on npm: \`npm install @deffector/agent\`. Documentation: https://mxmvshnvsk.github.io/deffector/
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Extension $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
